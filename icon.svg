<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6bff"/>
      <stop offset="1" stop-color="#6a3df0"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- falling price line -->
  <polyline points="20,38 44,60 64,46 96,88" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- current (lowest) price marker -->
  <circle cx="100" cy="94" r="15" fill="#2fd27a" stroke="#fff" stroke-width="6"/>
</svg>
