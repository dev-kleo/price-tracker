<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Cleo. MSc Economics and International Business. South Ural State University.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#141B34"/></linearGradient>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A78BFA" stop-opacity=".28"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
<clipPath id="rev"><rect x="540" y="0" width="0" height="300"><animate attributeName="width" values="0;620;620;0" keyTimes="0;.35;.9;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<rect width="1200" height="300" rx="20" fill="url(#bg)"/>
<g filter="url(#blur)" opacity=".55">
<circle cx="260" cy="60" r="110" fill="#5EEAD4" fill-opacity=".35"><animate attributeName="cx" values="260;420;260" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="60;120;60" dur="14s" repeatCount="indefinite"/></circle>
<circle cx="980" cy="250" r="130" fill="#A78BFA" fill-opacity=".4"><animate attributeName="cx" values="980;820;980" dur="17s" repeatCount="indefinite"/></circle>
</g>
<line x1="540" x2="1160" y1="80" y2="80" stroke="#fff" stroke-opacity=".06"/><line x1="540" x2="1160" y1="130" y2="130" stroke="#fff" stroke-opacity=".06"/><line x1="540" x2="1160" y1="180" y2="180" stroke="#fff" stroke-opacity=".06"/><line x1="540" x2="1160" y1="230" y2="230" stroke="#fff" stroke-opacity=".06"/>
<g clip-path="url(#rev)">
<path d="M560,210 L640,190 L720,200 L800,150 L880,165 L960,110 L1040,125 L1120,70 L1120,260 L560,260 Z" fill="url(#fl)"/>
<path d="M560,210 L640,190 L720,200 L800,150 L880,165 L960,110 L1040,125 L1120,70" fill="none" stroke="url(#ln)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<circle cx="1120" cy="70" r="6" fill="#A78BFA"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.34;.4;.9;1" dur="9s" repeatCount="indefinite"/></circle>
<circle cx="1120" cy="70" r="6" fill="none" stroke="#A78BFA"><animate attributeName="r" values="6;22" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="2.2s" repeatCount="indefinite"/></circle>
<g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
<text x="64" y="128" fill="#F1F5F9" font-size="68" font-weight="700" letter-spacing="-2">Cleo</text>
<text x="66" y="170" fill="#F1F5F9" font-size="22" font-weight="600">MSc Economics &amp; International Business</text>
<text x="66" y="200" fill="#94A3B8" font-size="18">South Ural State University</text>
<g font-size="18" fill="#5EEAD4">
<text x="66" y="248">Retrieval-augmented generation<animate attributeName="opacity" values="0;1;1;0;0;0;0;0" keyTimes="0;.05;.28;.33;1;1;1;1" dur="9s" repeatCount="indefinite"/></text>
<text x="66" y="248">Browser tools that keep data local<animate attributeName="opacity" values="0;0;0;1;1;0;0;0" keyTimes="0;.33;.38;.43;.61;.66;1;1" dur="9s" repeatCount="indefinite"/></text>
<text x="66" y="248">Software you can run and verify<animate attributeName="opacity" values="0;0;0;0;0;1;1;0" keyTimes="0;.66;.7;.72;.75;.78;.95;1" dur="9s" repeatCount="indefinite"/></text>
</g></g>
</svg>